[theme]
base = "dark"

# General color setup
textColor = "#e2e8f0"
primaryColor = "#2994f1"
backgroundColor = "#1d293d"
secondaryBackgroundColor = "#0f172b"

# Widgets
showWidgetBorder = true
borderColor = "#687383"

# Dataframes
dataframeHeaderBackgroundColor = "#1d293d"

# Base text
font = "Space Grotesk"
baseFontWeight = 300
baseFontSize = 14

# Heading text
headingFont = "Space Grotesk"
headingFontWeights = [300, 400, 400, 300, 300, 300]
headingFontSizes = ["2.5rem", "1.5rem", "1rem"]