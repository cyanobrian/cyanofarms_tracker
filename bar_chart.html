<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    #vis.vega-embed {
      width: 100%;
      display: flex;
    }

    #vis.vega-embed details,
    #vis.vega-embed details summary {
      position: relative;
    }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega@6"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.1"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>
</head>
<body>
  <div id="vis"></div>
  <script>
    (function(vegaEmbed) {
      var spec = {"config": {"view": {"continuousWidth": 300, "continuousHeight": 300}}, "data": {"name": "data-ea465f277b56e1c5057e39aaf0afbacc"}, "mark": {"type": "bar"}, "encoding": {"x": {"field": "category", "scale": {"domain": ["A", "B", "C", "D", "E"]}, "sort": "-y", "type": "nominal"}, "y": {"field": "value", "type": "quantitative"}}, "height": 300, "params": [{"name": "param_db82be42624d4632", "select": {"type": "interval", "encodings": ["x"]}, "bind": "scales"}], "title": "Top 5 Categories (Drag/Pan to see more)", "width": 500, "$schema": "https://vega.github.io/schema/vega-lite/v6.4.1.json", "datasets": {"data-ea465f277b56e1c5057e39aaf0afbacc": [{"category": "A", "value": 95}, {"category": "B", "value": 85}, {"category": "C", "value": 75}, {"category": "D", "value": 65}, {"category": "E", "value": 55}, {"category": "F", "value": 45}, {"category": "G", "value": 35}, {"category": "H", "value": 25}, {"category": "I", "value": 15}, {"category": "J", "value": 5}]}};
      var embedOpt = {"mode": "vega-lite"};

      function showError(el, error){
          el.innerHTML = ('<div style="color:red;">'
                          + '<p>JavaScript Error: ' + error.message + '</p>'
                          + "<p>This usually means there's a typo in your chart specification. "
                          + "See the javascript console for the full traceback.</p>"
                          + '</div>');
          throw error;
      }
      const el = document.getElementById('vis');
      vegaEmbed("#vis", spec, embedOpt)
        .catch(error => showError(el, error));
    })(vegaEmbed);

  </script>
</body>
</html>
